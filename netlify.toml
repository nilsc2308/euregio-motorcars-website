[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.classistatic.de; font-src 'self'; frame-src https://www.openstreetmap.org; connect-src 'self'; form-action 'self'; base-uri 'self'"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Die alte Domain leitete auf mobile.de um – typische Pfade auffangen
[[redirects]]
  from = "/fahrzeuge/*"
  to = "/fahrzeuge.html"
  status = 301
[[redirects]]
  from = "/bestand"
  to = "/fahrzeuge.html"
  status = 301
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 301
[[redirects]]
  from = "/kontakt"
  to = "/kontakt.html"
  status = 301
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
